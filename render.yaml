databases:
  - name: madhurai-chocolate-db
    databaseName: madhurai_chocolate
    user: madhurai_user
    plan: free

services:
  - type: web
    name: madhurai-chocolate
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: madhurai-chocolate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PAYMENT_GATEWAY
        value: MOCK_SANDBOX
      - key: UPI_VPA
        value: 9676823113-2@ybl
