<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" width="480" height="680">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FBF6EE" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="16" y="16" width="448" height="648" rx="24" fill="url(#cardBg)" stroke="#E6D7C3" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="16" y="16" width="448" height="12" rx="6" fill="url(#goldGrad)" />

  <!-- Brand Title -->
  <text x="240" y="68" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="800" fill="#2C170E" text-anchor="middle" letter-spacing="3">
    MADHURAI CHOCOLATE
  </text>
  <text x="240" y="92" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle" letter-spacing="1.5">
    ARTISANAL HANDCRAFTED CONFECTIONERY
  </text>

  <!-- Divider Line -->
  <line x1="60" y1="108" x2="420" y2="108" stroke="#E6D7C3" stroke-width="1" />

  <!-- Subhead -->
  <text x="240" y="136" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#4A2818" text-anchor="middle">
    Scan to Browse Catalog &amp; Order
  </text>
  <text x="240" y="156" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" fill="#78716C" text-anchor="middle">
    Open your phone camera to visit the customer storefront
  </text>

  <!-- QR Code Container Box -->
  <rect x="80" y="180" width="320" height="320" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" />
  
  <!-- Embedded QR Code Image -->
  <image href="data:image/png;base64," x="90" y="190" width="300" height="300" />

  <!-- URL Tag -->
  <rect x="100" y="518" width="280" height="32" rx="16" fill="#F3EDE2" />
  <text x="240" y="539" font-family="monospace, 'Courier New'" font-size="12" font-weight="700" fill="#2C170E" text-anchor="middle">
    https://madhuraichocolates.in
  </text>

  <!-- Badges Footer -->
  <text x="240" y="580" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">
    Pure Vegetable Fat • 0% Palm Oil • Zero Trans Fat
  </text>
  <text x="240" y="602" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" fill="#78716C" text-anchor="middle">
    FSSAI: 2018 2629000442 • Gudur, Andhra Pradesh
  </text>
  <text x="240" y="622" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">
    Customer Care: +91 96768 23113 | madhuraicompany@gmail.com
  </text>
</svg>