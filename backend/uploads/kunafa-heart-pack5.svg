<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="boxBgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#38190D" />
      <stop offset="50%" stop-color="#210E07" />
      <stop offset="100%" stop-color="#100502" />
    </radialGradient>
    <radialGradient id="goldAmbient" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Luxury Box Materials -->
    <linearGradient id="boxOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1208" />
      <stop offset="50%" stop-color="#1A0904" />
      <stop offset="100%" stop-color="#0F0402" />
    </linearGradient>
    <linearGradient id="boxRimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- Fluted Gold Cups -->
    <radialGradient id="goldCup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Chocolate Shell -->
    <linearGradient id="packChocShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2414" />
      <stop offset="45%" stop-color="#2C1308" />
      <stop offset="100%" stop-color="#140603" />
    </linearGradient>

    <!-- Pistachio & Kunafa Filling -->
    <linearGradient id="packPistachio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="50%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>
    <linearGradient id="packKataifi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" fill="url(#boxBgGrad)" />
  <circle cx="400" cy="400" r="350" fill="url(#goldAmbient)" />

  <!-- Shadow under box -->
  <ellipse cx="400" cy="625" rx="310" ry="45" fill="#050201" opacity="0.85" />

  <!-- LUXURY GIFT BOX CONTAINER (OCTAGONAL / ROUNDED RECTANGLE) -->
  <g filter="url(#boxShadow)" transform="translate(0, -15)">
    <!-- Outer Box Body -->
    <rect x="130" y="150" width="540" height="460" rx="36" fill="url(#boxOuterGrad)" stroke="url(#boxRimGold)" stroke-width="4" />
    <!-- Inner Gold Inset Rim -->
    <rect x="145" y="165" width="510" height="430" rx="26" fill="#150703" stroke="url(#boxRimGold)" stroke-width="1.5" stroke-dasharray="10 6" />

    <!-- Satin Inner Lining Texture -->
    <rect x="155" y="175" width="490" height="410" rx="20" fill="#1A0A05" />

    <!-- Ribbon Satin Cross Accent (Top Left to Bottom Right Subtle Accent) -->
    <path d="M 130 220 L 220 150 L 250 150 L 130 245 Z" fill="url(#boxRimGold)" opacity="0.4" />
    <path d="M 670 510 L 590 610 L 560 610 L 670 485 Z" fill="url(#boxRimGold)" opacity="0.4" />

    <!-- 5 GOLD FOIL CUPS WITH 5 SCULPTED HEART CHOCOLATES -->
    <!-- Position Layout:
         Top Row: 2 hearts (left: 275, 290; right: 525, 290)
         Center Centerpiece: 1 large hero heart (400, 390)
         Bottom Row: 2 hearts (left: 275, 490; right: 525, 490)
    -->

    <!-- 1. TOP-LEFT HEART -->
    <g transform="translate(280, 275)">
      <!-- Fluted Cup -->
      <circle cx="0" cy="0" r="54" fill="url(#goldCup)" opacity="0.85" />
      <circle cx="0" cy="0" r="46" fill="#140602" />
      <!-- Heart Chocolate -->
      <path d="M 0 32 C -24 16, -42 -2, -42 -24 A 18 18 0 0 1 -6 -32 A 18 18 0 0 1 0 -22 A 18 18 0 0 1 6 -32 A 18 18 0 0 1 42 -24 C 42 -2, 24 16, 0 32 Z" 
            fill="url(#packChocShell)" stroke="#F59E0B" stroke-width="1" />
      <!-- Gold Shimmer Highlight -->
      <ellipse cx="-12" cy="-16" rx="9" ry="4" transform="rotate(-30 -12 -16)" fill="#FFFFFF" opacity="0.3" />
      <!-- Crushed pistachio garnish -->
      <circle cx="2" cy="-4" r="2.5" fill="#84CC16" />
      <circle cx="-6" cy="4" r="2" fill="#F59E0B" />
    </g>

    <!-- 2. TOP-RIGHT HEART -->
    <g transform="translate(520, 275)">
      <circle cx="0" cy="0" r="54" fill="url(#goldCup)" opacity="0.85" />
      <circle cx="0" cy="0" r="46" fill="#140602" />
      <path d="M 0 32 C -24 16, -42 -2, -42 -24 A 18 18 0 0 1 -6 -32 A 18 18 0 0 1 0 -22 A 18 18 0 0 1 6 -32 A 18 18 0 0 1 42 -24 C 42 -2, 24 16, 0 32 Z" 
            fill="url(#packChocShell)" stroke="#F59E0B" stroke-width="1" />
      <ellipse cx="-12" cy="-16" rx="9" ry="4" transform="rotate(-30 -12 -16)" fill="#FFFFFF" opacity="0.3" />
      <circle cx="5" cy="-2" r="2.5" fill="#84CC16" />
      <circle cx="-4" cy="6" r="2" fill="#FEF08A" />
    </g>

    <!-- 3. HERO CENTER HEART (Cut open showing Kunafa & Pistachio Lava!) -->
    <g transform="translate(400, 380)">
      <!-- Gold Cup -->
      <circle cx="0" cy="0" r="70" fill="url(#goldCup)" />
      <circle cx="0" cy="0" r="60" fill="#140602" />

      <!-- Heart Silhouette -->
      <path d="M 0 44 C -34 22, -58 -2, -58 -32 A 25 25 0 0 1 -8 -44 A 25 25 0 0 1 0 -30 A 25 25 0 0 1 8 -44 A 25 25 0 0 1 58 -32 C 58 -2, 34 22, 0 44 Z" 
            fill="url(#packChocShell)" stroke="#F59E0B" stroke-width="1.4" />
      <!-- Left Shine -->
      <ellipse cx="-18" cy="-22" rx="12" ry="5" transform="rotate(-30 -18 -22)" fill="#FFFFFF" opacity="0.35" />

      <!-- Kunafa & Pistachio Cross Section on Right Side -->
      <path d="M 0 -15 C 15 -15, 45 0, 45 18 C 45 32, 25 38, 5 38 C 2 20, 0 5, 0 -15 Z" fill="#140602" />
      <path d="M 2 -10 C 14 -10, 40 2, 40 16 C 40 28, 22 34, 6 34 C 4 18, 2 6, 2 -10 Z" fill="url(#packPistachio)" />
      <!-- Kataifi Noodle Texture Threads -->
      <g stroke="url(#packKataifi)" stroke-width="1.8" stroke-linecap="round" fill="none">
        <path d="M 6 -5 Q 18 0 28 -3 Q 36 6 38 14" />
        <path d="M 8 6 Q 22 4 32 10 Q 36 18 36 24" />
        <path d="M 10 16 Q 20 22 30 18 Q 34 26 28 30" />
        <path d="M 14 -2 Q 22 10 24 24" />
      </g>
      <!-- Pistachio Crumb -->
      <circle cx="18" cy="8" r="3" fill="#84CC16" />
      <circle cx="28" cy="18" r="2.5" fill="#FEF08A" />
      <circle cx="-16" cy="10" r="2.5" fill="url(#boxRimGold)" />
    </g>

    <!-- 4. BOTTOM-LEFT HEART -->
    <g transform="translate(280, 485)">
      <circle cx="0" cy="0" r="54" fill="url(#goldCup)" opacity="0.85" />
      <circle cx="0" cy="0" r="46" fill="#140602" />
      <path d="M 0 32 C -24 16, -42 -2, -42 -24 A 18 18 0 0 1 -6 -32 A 18 18 0 0 1 0 -22 A 18 18 0 0 1 6 -32 A 18 18 0 0 1 42 -24 C 42 -2, 24 16, 0 32 Z" 
            fill="url(#packChocShell)" stroke="#F59E0B" stroke-width="1" />
      <ellipse cx="-12" cy="-16" rx="9" ry="4" transform="rotate(-30 -12 -16)" fill="#FFFFFF" opacity="0.3" />
      <circle cx="-2" cy="0" r="2.5" fill="#84CC16" />
      <circle cx="6" cy="6" r="2" fill="#F59E0B" />
    </g>

    <!-- 5. BOTTOM-RIGHT HEART -->
    <g transform="translate(520, 485)">
      <circle cx="0" cy="0" r="54" fill="url(#goldCup)" opacity="0.85" />
      <circle cx="0" cy="0" r="46" fill="#140602" />
      <path d="M 0 32 C -24 16, -42 -2, -42 -24 A 18 18 0 0 1 -6 -32 A 18 18 0 0 1 0 -22 A 18 18 0 0 1 6 -32 A 18 18 0 0 1 42 -24 C 42 -2, 24 16, 0 32 Z" 
            fill="url(#packChocShell)" stroke="#F59E0B" stroke-width="1" />
      <ellipse cx="-12" cy="-16" rx="9" ry="4" transform="rotate(-30 -12 -16)" fill="#FFFFFF" opacity="0.3" />
      <circle cx="4" cy="-4" r="2.5" fill="#84CC16" />
      <circle cx="-5" cy="4" r="2" fill="#FDE68A" />
    </g>

    <!-- Brand Seal / Gold Plaque at Top Center of Box -->
    <g transform="translate(400, 195)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#240D05" stroke="url(#boxRimGold)" stroke-width="1.8" />
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FEF08A" letter-spacing="2">
        MADHURAI ARTISANAL COLLECTION
      </text>
    </g>
  </g>

  <!-- TOP BADGE: COMING SOON / PRE-BOOKING -->
  <g transform="translate(400, 68)">
    <rect x="-210" y="0" width="420" height="46" rx="23" fill="#1C0A04" stroke="url(#boxRimGold)" stroke-width="2" />
    <path d="M -180 23 L -175 13 L -170 23 L -160 28 L -170 33 L -175 43 L -180 33 L -190 28 Z" fill="#F59E0B" />
    <path d="M 180 23 L 175 13 L 170 23 L 160 28 L 170 33 L 175 43 L 180 33 L 190 28 Z" fill="#F59E0B" />
    <text x="0" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FEF3C7" letter-spacing="2">
      PACK OF 5 KUNAFA HEARTS • COMING SOON
    </text>
  </g>

  <!-- BOTTOM CARD INFO: 50g PACK OF 5 & PRE-BOOKING OFFER -->
  <g transform="translate(400, 715)">
    <rect x="-250" y="-36" width="500" height="72" rx="36" fill="rgba(28, 12, 6, 0.95)" stroke="#F59E0B" stroke-width="1.8" />
    <text x="0" y="-8" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">
      Pack of 5 Kunafa Chocolates (50g Box)
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FDE68A">
      Pre-Booking: ₹125 • <tspan fill="#34D399">Pay ₹50 Now</tspan> • ₹75 on Delivery
    </text>
  </g>
</svg>
